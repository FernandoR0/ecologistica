# SonarQube Cloud (https://sonarcloud.io) - el análisis corre en .github/workflows/sonarcloud.yml
sonar.organization=fernandor0
sonar.projectKey=FernandoR0_ecologistica
sonar.projectName=EcoLogística - Optimizador de rutas sostenibles
sonar.projectVersion=1.1.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,frontend/src/test/**,frontend/src/setupTests.ts,backend/tests/**,e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,backend/app/seed.py,frontend/src/test/**,frontend/src/setupTests.ts
sonar.coverage.exclusions=backend/app/seed.py,frontend/src/main.tsx,frontend/src/setupTests.ts,frontend/src/vite-env.d.ts

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
