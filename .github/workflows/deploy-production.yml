name: Deploy a producción

# Despliegue continuo: API en Render (Deploy Hook) y frontend en Vercel (CLI), solo con credenciales en GitHub Secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar antes de desplegar
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - working-directory: backend
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock
          ruff check app tests
          pytest -q

  api:
    name: API en Render
    needs: verificar
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    environment: produccion
    steps:
      - name: Disparar el despliegue con el Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
      - name: Esperar a que la nueva versión responda
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          sleep 60
          for i in $(seq 1 30); do
            if curl -fsS --max-time 30 "$API_URL/api/health"; then echo; echo "API en línea"; exit 0; fi
            sleep 20
          done
          echo "La API no respondió a tiempo"; exit 1

  web:
    name: Frontend en Vercel
    needs: api
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    environment: produccion
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install --global --ignore-scripts vercel@41.7.3
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verificar-produccion:
    name: Pruebas @public sobre producción
    needs: web
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    env:
      CI: "true"
      E2E_BASE_URL: ${{ vars.PRODUCCION_URL }}
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium
          ./node_modules/.bin/playwright test --project=chromium --grep @public
      - if: always()
        run: npm run e2e:metricas
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-produccion, path: frontend/playwright-report, retention-days: 14 }
