name: Tests

# Pruebas unitarias, de integración y E2E (Playwright headless en 3 navegadores) con reportes como artifacts.
# Cada 6 horas vigila la disponibilidad de producción con las pruebas @public.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarias:
    name: Unitarias e integración
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Backend - pytest (motor, API y reglas de negocio)
        working-directory: backend
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock
          pytest --cov=app --cov-report=xml --cov-report=term --junitxml=pytest.xml
      - name: Frontend - Vitest
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-unitarias
          path: |
            backend/coverage.xml
            backend/pytest.xml
            frontend/coverage/lcov.info

  e2e:
    name: E2E Playwright (${{ matrix.browser }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eco, POSTGRES_PASSWORD: eco, POSTGRES_DB: ecologistica_e2e_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U eco" --health-interval 5s --health-retries 10
    env:
      CI: "true"
      E2E_DATABASE_URL: postgresql+psycopg://eco:eco@localhost:5432/ecologistica_e2e_test
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: "pip install --only-binary :all: --require-hashes -r backend/requirements.lock"
      - working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Suite E2E headless
        working-directory: frontend
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Resumen de métricas
        if: always()
        working-directory: frontend
        run: npm run e2e:metricas
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "playwright-report-${{ matrix.browser }}", path: frontend/playwright-report, retention-days: 14 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "playwright-results-${{ matrix.browser }}", path: frontend/test-results, retention-days: 14 }

  monitoreo-produccion:
    name: Monitoreo de producción (@public)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04  # Playwright 1.52 publica navegadores hasta Ubuntu 24.04
    env:
      CI: "true"
      E2E_BASE_URL: ${{ vars.PRODUCCION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Despertar la API (plan gratuito con arranque en frío)
        run: |
          for i in 1 2 3; do
            inicio=$(date +%s)
            if curl -fsS --max-time 90 "$E2E_BASE_URL/api/health"; then
              echo "API disponible en $(( $(date +%s) - inicio )) s" >> $GITHUB_STEP_SUMMARY; break
            fi
            sleep 10
          done
      - working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --grep @public
      - if: always()
        working-directory: frontend
        run: npm run e2e:metricas
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report-produccion, path: frontend/playwright-report, retention-days: 14 }
