name: CI

# Estilo, análisis estático, compilación de frontend y backend y validación de dependencias
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, análisis estático, dependencias y build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.lock }
      - run: "pip install --only-binary :all: --require-hashes -r requirements-dev.lock"
      - name: Estilo y análisis estático (Ruff, incluye reglas de seguridad Bandit)
        run: ruff check app tests scripts
      - name: Compilación de todos los módulos
        run: python -m compileall -q app
      - name: Validación de dependencias (pip-audit)
        run: |
          pip install --quiet --only-binary :all: pip-audit==2.9.0
          pip-audit -r requirements.txt --progress-spinner off
      - name: Build de la imagen Docker de la API
        run: docker build -t ecologistica-api:ci .

  frontend:
    name: Frontend (lint, tipos, dependencias y build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts
      - name: ESLint y verificación de tipos (aplicación y pruebas E2E)
        run: npm run lint
      - name: Validación de dependencias de producción (npm audit)
        run: npm audit --omit=dev --audit-level=high
      - name: Build de producción
        run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 7 }
