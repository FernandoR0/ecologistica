server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Usa los archivos .gz generados en el build y comprime lo demas al vuelo
  gzip_static on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Archivos con hash en el nombre: un ano de cache
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El index.html siempre se revalida para tomar la ultima version
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
